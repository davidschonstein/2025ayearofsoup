  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

  <script>
    // ============================================================
    // DATA SOURCE (Google Sheet via GViz, loaded as <script> to avoid CORS)
    // ============================================================
    const SHEET_ID = "1bejXLap1NfhwSrOQBbX_mT8GYkcXPtApJvSOHztGeNg";
    const SHEET_GID = 0; // change if your data tab has a different gid (see the sheet URL)

    const SOUP_DATA_URL  = "https://docs.google.com/spreadsheets/d/1bejXLap1NfhwSrOQBbX_mT8GYkcXPtApJvSOHztGeNg/edit?usp=sharing";
    const SOUP_PHOTOS_URL = "https://drive.google.com/drive/folders/1GpVmX1FzJvZJUpIwPJ9OEC4PtRbTnFhd?usp=sharing";

    const NO_GPS_ANCHOR = { lat: -3.69505357626051, lon: 56.77602191711678 };

    function escapeHTML(str) {
      return String(str ?? "").replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[s]));
    }


    function isValidHttpUrl(u) {
      if (!u) return false;
      try {
        const url = new URL(String(u).trim());
        return (url.protocol === "http:" || url.protocol === "https:");
      } catch (e) {
        return false;
      }
    }


function normalizePhotoUrl(raw) {
  const s = String(raw || "").trim();
  if (!isValidHttpUrl(s)) return null;
  const href = s;
  let embed = null;

  // Google Drive file links -> direct image view
  let m = href.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m && m[1]) embed = `https://drive.google.com/uc?export=view&id=${m[1]}`;
  if (!embed) {
    m = href.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
    if (m && m[1]) embed = `https://drive.google.com/uc?export=view&id=${m[1]}`;
  }
  if (!embed) {
    const lower = href.toLowerCase();
    if (lower.match(/\.(png|jpe?g|gif|webp)(\?.*)?$/)) embed = href;
    if (lower.includes("googleusercontent.com")) embed = href;
  }
  return { href, embed };
}

function openPhotoModal(url) {
  if (!url) return false;
  const modal = document.getElementById("photoModal");
  const body = document.getElementById("photoModalBody");
  const openLink = document.getElementById("photoModalOpenLink");
  if (!modal || !body || !openLink) return false;

  const norm = normalizePhotoUrl(url) || { href: url, embed: null };
  body.innerHTML = "";

  if (norm.embed) {
    const img = document.createElement("img");
    img.alt = "Soup photo";
    img.src = norm.embed;
    img.loading = "eager";
    img.onerror = () => {
      body.innerHTML = "";
      const ifr = document.createElement("iframe");
      ifr.src = norm.href;
      body.appendChild(ifr);
    };
    body.appendChild(img);
  } else {
    const ifr = document.createElement("iframe");
    ifr.src = norm.href;
    body.appendChild(ifr);
  }

  openLink.href = norm.href;
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  return false;
}

function closePhotoModal() {
  const modal = document.getElementById("photoModal");
  if (!modal) return;
  modal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  const body = document.getElementById("photoModalBody");
  if (body) body.innerHTML = "";
}

window.addEventListener("DOMContentLoaded", () => {
  const b = document.getElementById("photoModalBackdrop");
  const c = document.getElementById("photoModalClose");
  if (b) b.addEventListener("click", closePhotoModal, { passive: true });
  if (c) c.addEventListener("click", closePhotoModal, { passive: true });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePhotoModal(); });
});



// Delegate clicks for popup photo previews (works on mobile + desktop)
document.addEventListener('click', (e)=>{
  const target = e.target.closest('.photo-preview-btn, .photo-thumb');
  if(!target) return;
  const url = target.getAttribute('data-photo');
  if(url && isValidHttpUrl(url)){
    e.preventDefault();
    e.stopPropagation();
    openPhotoModal(url);
  }
}, { passive: false });

function median(nums) {
  const a = nums.slice().sort((x,y)=>x-y);
  if (!a.length) return null;
  const mid = Math.floor(a.length/2);
  return a.length % 2 ? a[mid] : (a[mid-1] + a[mid]) / 2;
}

function updateMiniStats(visibleRecs) {
  const reviewsEl = document.getElementById("statTotalReviews");
  const countriesEl = document.getElementById("statTotalCountries");
  const citiesEl = document.getElementById("statTotalCities");
  const bestEl = document.getElementById("statBest1");
  const worstEl = document.getElementById("statWorst1");
  if (!reviewsEl || !countriesEl || !citiesEl || !bestEl || !worstEl) return;

  const recs = Array.isArray(visibleRecs) ? visibleRecs : [];
  reviewsEl.textContent = String(recs.length);

  const countries = new Set();
  const cities = new Set();

  for (const rec of recs) {
    const s = (rec && rec.stats) ? rec.stats : {};
    const ctry = (s.Country ?? s.country ?? "").toString().trim();
    const city = (s.City ?? s.city ?? "").toString().trim();
    const state = (s.State ?? s.state ?? "").toString().trim();

    if (ctry && ctry.toLowerCase() !== "unknown") countries.add(ctry);
    if (city && city.toLowerCase() !== "unknown") {
      const key = state ? `${city}, ${state}` : city;
      cities.add(key);
    }
  }

  countriesEl.textContent = String(countries.size);
  citiesEl.textContent = String(cities.size);

  const rated = recs
    .filter((r) => r && Number.isFinite(r.ratingNum))
    .slice()
    .sort((a, b) => (b.ratingNum - a.ratingNum) || ((b.dateObj?.getTime?.() || 0) - (a.dateObj?.getTime?.() || 0)));

  const best = rated.length ? rated[0] : null;
  const worst = rated.length ? rated[rated.length - 1] : null;

  const fmt = (rec) => {
    if (!rec) return "—";
    const soup = (rec.stats && (rec.stats.Soup || rec.stats.soup)) ? (rec.stats.Soup || rec.stats.soup) : (rec.soup || "Unknown soup");
    const reviewer = rec.reviewer || "Unknown";
    const rating = Number.isFinite(rec.ratingNum) ? rec.ratingNum.toFixed(1) : "—";
    return `${reviewer} — ${soup} (${rating})`;
  };

  bestEl.textContent = fmt(best);
  worstEl.textContent = fmt(worst);
}
function getField(row, candidates) {
      if (!row) return "";
      // 1) Exact-key match first
      for (const k of candidates) {
        if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== "") return row[k];
      }
      // 2) Normalized-key match (handles trailing spaces, punctuation, case differences)
      const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
      const keyMap = {};
      for (const key of Object.keys(row)) {
        keyMap[norm(key)] = key;
      }
      for (const cand of candidates) {
        const nk = norm(cand);
        if (nk && keyMap[nk]) {
          const realKey = keyMap[nk];
          const v = row[realKey];
          if (v !== undefined && v !== null && String(v).trim() !== "") return v;
        }
      }
      return "";
    }

    function parseLatLonFromString(s) {
      if (!s) return { lat: NaN, lon: NaN };
      const nums = String(s).match(/[-+]?\d+(?:\.\d+)?/g);
      if (!nums || nums.length < 2) return { lat: NaN, lon: NaN };
      const lat = parseFloat(nums[0]);
      const lon = parseFloat(nums[1]);
      if (!isFinite(lat) || !isFinite(lon)) return { lat: NaN, lon: NaN };
      if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return { lat: NaN, lon: NaN };
      return { lat, lon };
    }

    function getLatLon(row) {
      const latVal = getField(row, ["Latitude","latitude","LATITUDE"]);
      const lonVal = getField(row, ["Longitude","longitude","LONGITUDE","Long"]);
      let lat = parseFloat(latVal);
      let lon = parseFloat(lonVal);
      if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) return { lat, lon, hasGPS: true };

      const gps = getField(row, ["GPS coordinates","GPS Coordinates","gps coordinates","GPS","Gps"]);
      const ll = parseLatLonFromString(gps);
      if (isFinite(ll.lat) && isFinite(ll.lon)) return { lat: ll.lat, lon: ll.lon, hasGPS: true };

      return { lat: NaN, lon: NaN, hasGPS: false };
    }

        function parseISODate(dateStr) {
      // Expecting YYYY-MM-DD (or YYYY/MM/DD). Returns Date at local midnight.
      if (!dateStr) return null;
      const s = String(dateStr).trim();
      const m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (!m) return null;
      const y = Number(m[1]), mo = Number(m[2]) - 1, d = Number(m[3]);
      const dt = new Date(y, mo, d);
      return Number.isNaN(dt.getTime()) ? null : dt;
    }

function parseMonth(dateStr) {
      if (!dateStr) return "Unknown";
      const d = new Date(String(dateStr).replace(/\//g,"-") + "T00:00:00");
      if (isNaN(d.getTime())) return "Unknown";
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2, "0");
      return `${y}-${m}`;
    }

    function uniqSorted(arr) {
      return Array.from(new Set(arr.filter(x => x && x !== "nan")))
        .sort((a,b)=> String(a).localeCompare(String(b)));
    }

    function ratingColor(r) {
      if (!isFinite(r)) return "rgb(180,180,180)";
      const t = Math.max(0, Math.min(10, r)) / 10;
      const stops = [
        { t: 0.0, c: [0xd7, 0x30, 0x27] },
        { t: 0.5, c: [0xfe, 0xe0, 0x8b] },
        { t: 1.0, c: [0x1a, 0x98, 0x50] }
      ];
      let a = stops[0], b = stops[1];
      if (t > 0.5) { a = stops[1]; b = stops[2]; }
      const tt = (t - a.t) / (b.t - a.t);
      const c = a.c.map((v,i)=> Math.round(v + (b.c[i]-v)*tt));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }

    function gvizToObjects(resp) {
      if (!resp || !resp.table) return [];
      const cols = (resp.table.cols || []).map(c => (c.label || c.id || "").trim());
      const rows = resp.table.rows || [];
      const out = [];
      for (const r of rows) {
        const obj = {};
        const cells = r.c || [];
        for (let i=0; i<cols.length; i++) {
          const key = cols[i] || `Column${i+1}`;
          const cell = cells[i];
          const val = cell ? (cell.f ?? cell.v) : "";
          obj[key] = val === null || val === undefined ? "" : val;
        }
        const any = Object.values(obj).some(v => String(v).trim() !== "");
        if (any) out.push(obj);
      }
      return out;
    }

    function loadSheetObjects() {
      return new Promise((resolve, reject) => {
        window.handleGViz = function(resp) {
          try { resolve(gvizToObjects(resp)); }
          catch (e) { reject(e); }
        };
        const s = document.createElement("script");
        s.src = gvizUrl();
        s.async = true;
        s.onerror = () => reject(new Error("Failed to load Google Sheet data. Check sharing settings and gid."));
        document.head.appendChild(s);
      });
    }

          let cd = new Date(d);
          if (cd < timelineMinDate) cd = new Date(timelineMinDate);
          if (cd > timelineAbsMaxDate) cd = new Date(timelineAbsMaxDate);
          timelineMaxDate = cd;

          const off = Math.round((cd - timelineMinDate) / MS_DAY);
          if (timelineSlider) timelineSlider.value = String(off);
          if (timelineLabel) timelineLabel.textContent = `≤ ${fmtISO(cd)}`;
        }

        if (dated.length) {
          timelineMinDate = dated[0];
          timelineAbsMaxDate = dated[dated.length - 1];
          const diffDays = Math.max(0, Math.round((timelineAbsMaxDate - timelineMinDate) / MS_DAY));

          if (timelineSlider) {
            timelineSlider.min = "0";
            timelineSlider.max = String(diffDays);
            timelineSlider.step = "1";
          }

          // Default to last review date so all soups show.
          setTimelineToDate(timelineAbsMaxDate);

          if (timelineSlider) {
            timelineSlider.addEventListener("input", () => {
              stopPlay();
              const off = Number(timelineSlider.value || 0);
              const d = addDays(timelineMinDate, off);
              setTimelineToDate(d);
              applyFilters();
            });
          }

          if (timelinePlay) {
            timelinePlay.addEventListener("click", () => {
              if (playTimer) { stopPlay(); return; }
              timelinePlay.textContent = "Pause";

              playTimer = setInterval(() => {
                if (!timelineMaxDate) timelineMaxDate = new Date(timelineMinDate);

                const mode = (timelineSpeed && timelineSpeed.value) ? timelineSpeed.value : "day";
                let next = new Date(timelineMaxDate);

                if (mode === "week") next = addDays(next, 7);
                else if (mode === "month") next = addMonths(next, 1);
                else next = addDays(next, 1);

                if (next >= timelineAbsMaxDate) next = new Date(timelineAbsMaxDate);

                setTimelineToDate(next);
                applyFilters();

                if (next.getTime() === timelineAbsMaxDate.getTime()) stopPlay();
              }, 1000);
            });
          }
        } else {
          if (timelineControls) timelineControls.style.display = "none";
        }

const status = document.getElementById("filterStatus");
        if (status) status.textContent = "Showing " + records.length + " soups";

        function applyFilters() {
          const reviewerVal = document.getElementById("filterReviewer").value;
          const monthVal = document.getElementById("filterMonth").value;
          const ratingVal = document.getElementById("filterRating").value;

          cluster.clearLayers();
          let shown = 0;
          const visible = [];

          records.forEach(rec => {
            let ok = true;
            if (reviewerVal !== "All") ok = ok && (rec.reviewer === reviewerVal);
            if (monthVal !== "All") ok = ok && (rec.month === monthVal);
            if (ratingVal !== "All") ok = ok && (String(rec.rating) === String(ratingVal));

            if (timelineMaxDate && rec.dateObj) ok = ok && (rec.dateObj <= timelineMaxDate);

            if (ok) { cluster.addLayer(rec.marker); shown++; visible.push(rec); }
          });

          updateMiniStats(visible);
          if (status) status.textContent = "Showing " + shown + " soups";
        }

        function clearFilters() {
          stopPlay();
          if (timelineAbsMaxDate) setTimelineToDate(timelineAbsMaxDate);

          cluster.clearLayers();
          records.forEach(rec => cluster.addLayer(rec.marker));
          document.getElementById("filterReviewer").value = "All";
          document.getElementById("filterMonth").value = "All";
          document.getElementById("filterRating").value = "All";
          if (status) status.textContent = "Showing " + records.length + " soups";
        }
        document.getElementById("applyFilters").addEventListener("click", applyFilters);
        document.getElementById("clearFilters").addEventListener("click", clearFilters);
        applyFilters();
      }

      wire();
    }

    main().catch(err => {
      console.error(err);
      alert("Error loading soup data from Google Sheets. Open the console for details.");
    });
  </script>
</body>
